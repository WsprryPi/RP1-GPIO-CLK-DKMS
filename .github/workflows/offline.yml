# SPDX-License-Identifier: MIT
name: Offline development and package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          fetch-depth: 0
      - name: Install build tools
        timeout-minutes: 15
        run: |
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential device-tree-compiler shellcheck debhelper dh-dkms python3-jsonschema zstd
      - name: Offline contracts and host C tests
        run: make check
      - name: Validate exact development manifest schema
        run: |
          ./scripts/render-development-tree --source . --output /tmp/rp1-development-render
          python3 -c 'import json,jsonschema; jsonschema.Draft202012Validator(json.load(open("schema/rp1-gpclk-source-development-manifest.schema.json"))).validate(json.load(open("/tmp/rp1-development-render/DEVELOPMENT_MANIFEST.json")))'
      - name: Build and independently validate the unpublished candidate
        run: |
          ./scripts/build-release-candidate --version "$(python3 scripts/version_identity.py version)" --source-commit "$(git rev-parse HEAD)" --output /tmp/rp1-candidate
          ./scripts/validate-release-candidate --candidate /tmp/rp1-candidate --source-commit "$(git rev-parse HEAD)"
      - name: Validate package version and ordering
        run: |
          package=$(python3 scripts/version_identity.py package)
          version=$(python3 scripts/version_identity.py debian)
          test "$(dpkg-deb -f "/tmp/rp1-candidate/$package" Version)" = "$version"

  lifecycle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          fetch-depth: 0
      - name: Provision disposable Debian and exact representative headers
        timeout-minutes: 20
        run: docker build -t rp1-lifecycle -f tools/package-lifecycle.Containerfile .
      - name: Rebuild exact candidate and synthetic passive version fixture
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/rp1-lifecycle-inputs
          chmod 0777 /tmp/rp1-lifecycle-inputs
          docker run --rm --network none --cap-drop ALL --user nobody \
            -e SOURCE_COMMIT="$(git rev-parse HEAD)" \
            -v "$PWD:/source:ro" -v /tmp/rp1-lifecycle-inputs:/output \
            -w /source rp1-lifecycle sh -eu -c '
              ./scripts/build-release-candidate --version "$(python3 scripts/version_identity.py version)" --source-commit "$SOURCE_COMMIT" --output /output/candidate
              ./scripts/validate-release-candidate --candidate /output/candidate --source-commit "$SOURCE_COMMIT"
              ./scripts/build-lifecycle-version-fixture --source-commit "$SOURCE_COMMIT" --output /output/predecessor'
      - name: Real package and DKMS lifecycle with controlled faults
        timeout-minutes: 65
        run: |
          python3 tools/run-package-lifecycle.py --image rp1-lifecycle \
            --candidate /tmp/rp1-lifecycle-inputs/candidate \
            --predecessor /tmp/rp1-lifecycle-inputs/predecessor \
            --output /tmp/rp1-lifecycle-results
      - name: Bounded lifecycle summary including failures
        if: always()
        timeout-minutes: 1
        run: python3 tools/summarize-lifecycle.py /tmp/rp1-lifecycle-results/result.json
      - name: Public provider removal with real package preflight
        timeout-minutes: 10
        run: |
          mkdir -m 0777 /tmp/rp1-public-removal-results
          docker run --rm --network none --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/source:ro" -v /tmp/rp1-lifecycle-inputs/candidate:/candidate:ro \
            -v /tmp/rp1-lifecycle-inputs/predecessor:/predecessor:ro \
            -v /tmp/rp1-public-removal-results:/results \
            -w /source rp1-lifecycle python3 tests/provider_package_removal_linux.py
      - name: Native version upgrade and clean uninstall
        timeout-minutes: 20
        run: |
          mkdir -m 0777 /tmp/rp1-upgrade-results
          docker run --rm --network none --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/source:ro" -v /tmp/rp1-upgrade-results:/results \
            -w /source rp1-lifecycle python3 tests/package_upgrade_linux.py
